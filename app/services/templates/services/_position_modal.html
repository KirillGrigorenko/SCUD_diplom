<div class="modal-backdrop" id="position-modal" style="display:none">
    <div class="modal">
        <div class="modal__header">
            <h2 class="modal__title">Новая должность</h2>
            <button type="button" class="modal__close" id="modal-close">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
        </div>
        <div class="modal__body">
            <div id="modal-error" class="form-error" style="display:none"></div>
            <label class="input-label">
                <span class="input-label__text">Название <span style="color:var(--danger)">*</span></span>
                <input class="input" type="text" id="modal-pos-name" placeholder="Например, Разработчик">
            </label>
            <label class="input-label" style="margin-top:12px">
                <span class="input-label__text">Отдел</span>
                <div class="input-with-add">
                    <select class="input" id="modal-pos-dept">
                        <option value="">— Не выбран —</option>
                        {% for dept in departments %}
                        <option value="{{ dept.pk }}">{{ dept.name }}</option>
                        {% endfor %}
                    </select>
                    <button type="button" id="btn-add-dept" class="btn-add" title="Добавить отдел">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    </button>
                </div>
            </label>
            <div id="new-dept-row" style="display:none; margin-top:8px;">
                <div id="dept-error" class="form-error" style="display:none; margin-bottom:6px;"></div>
                <div class="input-with-add">
                    <input class="input" type="text" id="new-dept-name" placeholder="Название отдела">
                    <button type="button" id="btn-dept-save" class="btn-add btn-add--confirm" title="Сохранить отдел">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                    </button>
                    <button type="button" id="btn-dept-cancel" class="btn-add btn-add--danger" title="Отмена">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                    </button>
                </div>
            </div>
        </div>
        <div class="modal__footer">
            <button type="button" class="button button--outline" id="modal-cancel">Отмена</button>
            <button type="button" class="button button--primary" id="modal-save">Создать</button>
        </div>
    </div>
</div>

<script>
(function () {
    var modal   = document.getElementById('position-modal');
    var btnOpen = document.getElementById('btn-add-position');
    var btnClose = document.getElementById('modal-close');
    var btnCancel = document.getElementById('modal-cancel');
    var btnSave = document.getElementById('modal-save');
    var nameInput = document.getElementById('modal-pos-name');
    var deptSelect = document.getElementById('modal-pos-dept');
    var errorBox = document.getElementById('modal-error');
    var positionSelect = document.getElementById('f-position');

    var btnAddDept = document.getElementById('btn-add-dept');
    var newDeptRow = document.getElementById('new-dept-row');
    var newDeptName = document.getElementById('new-dept-name');
    var btnDeptSave = document.getElementById('btn-dept-save');
    var btnDeptCancel = document.getElementById('btn-dept-cancel');
    var deptError = document.getElementById('dept-error');

    function openModal() {
        nameInput.value = '';
        deptSelect.value = '';
        hideNewDeptRow();
        errorBox.style.display = 'none';
        modal.style.display = 'flex';
        setTimeout(function () { nameInput.focus(); }, 50);
    }

    function closeModal() {
        modal.style.display = 'none';
        hideNewDeptRow();
    }

    function showNewDeptRow() {
        newDeptRow.style.display = 'block';
        newDeptName.value = '';
        deptError.style.display = 'none';
        btnAddDept.style.display = 'none';
        setTimeout(function () { newDeptName.focus(); }, 50);
    }

    function hideNewDeptRow() {
        newDeptRow.style.display = 'none';
        btnAddDept.style.display = '';
    }

    function setSelectValue(select, value, text) {
        var opt = document.createElement('option');
        opt.value = value;
        opt.textContent = text;
        select.appendChild(opt);
        select.value = value;

        var wrapper = select.closest('.custom-select');
        if (!wrapper) return;
        var span = wrapper.querySelector('.custom-select__trigger span');
        var dropdown = wrapper.querySelector('.custom-select__dropdown');
        if (dropdown) {
            var li = document.createElement('li');
            li.className = 'custom-select__option custom-select__option--selected';
            li.dataset.value = value;
            li.textContent = text;
            li.addEventListener('mousedown', function (e) { e.preventDefault(); });
            li.addEventListener('click', function () {
                select.value = value;
                if (span) span.textContent = text;
                dropdown.querySelectorAll('.custom-select__option').forEach(function (el) {
                    el.classList.remove('custom-select__option--selected');
                });
                li.classList.add('custom-select__option--selected');
                wrapper.classList.remove('custom-select--open');
            });
            dropdown.querySelectorAll('.custom-select__option').forEach(function (el) {
                el.classList.remove('custom-select__option--selected');
            });
            dropdown.appendChild(li);
        }
        if (span) span.textContent = text;
    }

    if (btnOpen) btnOpen.addEventListener('click', openModal);
    if (btnClose) btnClose.addEventListener('click', closeModal);
    if (btnCancel) btnCancel.addEventListener('click', closeModal);

    modal.addEventListener('click', function (e) {
        if (e.target === modal) closeModal();
    });

    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') {
            if (newDeptRow.style.display !== 'none') {
                hideNewDeptRow();
            } else {
                closeModal();
            }
        }
    });

    if (btnAddDept) btnAddDept.addEventListener('click', showNewDeptRow);
    if (btnDeptCancel) btnDeptCancel.addEventListener('click', hideNewDeptRow);

    if (btnDeptSave) btnDeptSave.addEventListener('click', function () {
        var name = newDeptName.value.trim();
        if (!name) {
            deptError.textContent = 'Введите название отдела.';
            deptError.style.display = 'block';
            newDeptName.focus();
            return;
        }

        btnDeptSave.disabled = true;

        var fd = new FormData();
        fd.append('name', name);
        fd.append('csrfmiddlewaretoken', document.querySelector('[name=csrfmiddlewaretoken]').value);

        fetch('{% url "department_create" %}', {
            method: 'POST',
            body: fd,
            credentials: 'same-origin',
        })
        .then(function (r) { return r.json(); })
        .then(function (data) {
            if (data.error) {
                deptError.textContent = data.error;
                deptError.style.display = 'block';
            } else {
                setSelectValue(deptSelect, String(data.pk), data.name);
                hideNewDeptRow();
            }
        })
        .catch(function () {
            deptError.textContent = 'Ошибка соединения с сервером.';
            deptError.style.display = 'block';
        })
        .finally(function () {
            btnDeptSave.disabled = false;
        });
    });

    newDeptName.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); btnDeptSave.click(); }
    });

    if (btnSave) btnSave.addEventListener('click', function () {
        var name = nameInput.value.trim();
        if (!name) {
            errorBox.textContent = 'Введите название должности.';
            errorBox.style.display = 'block';
            nameInput.focus();
            return;
        }

        btnSave.disabled = true;
        btnSave.textContent = 'Сохранение…';

        var formData = new FormData();
        formData.append('name', name);
        formData.append('department', deptSelect.value);
        formData.append('csrfmiddlewaretoken', document.querySelector('[name=csrfmiddlewaretoken]').value);

        fetch('{% url "position_create" %}', {
            method: 'POST',
            body: formData,
            credentials: 'same-origin',
        })
        .then(function (r) { return r.json(); })
        .then(function (data) {
            if (data.error) {
                errorBox.textContent = data.error;
                errorBox.style.display = 'block';
            } else {
                setSelectValue(positionSelect, String(data.pk), data.label);
                closeModal();
            }
        })
        .catch(function () {
            errorBox.textContent = 'Ошибка соединения с сервером.';
            errorBox.style.display = 'block';
        })
        .finally(function () {
            btnSave.disabled = false;
            btnSave.textContent = 'Создать';
        });
    });
}());
</script>
