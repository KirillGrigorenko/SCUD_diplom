{% extends 'services/base.html' %}
{% block title %}Редактирование — {{ employee.full_name }}{% endblock %}

{% block content %}

<section class="page-header">
    <div class="page-header__main">
        <h1 class="page-title">Редактирование сотрудника</h1>
    </div>
    <a class="button button--outline" href="{% url 'employee_detail' employee.id %}">← Назад</a>
</section>

<form method="post" class="edit-form" autocomplete="off">
    {% csrf_token %}

    <div class="edit-grid">
        <div class="edit-panel">
            <h2 class="edit-panel__title">Основные данные</h2>
            <label class="input-label">
                <span class="input-label__text">Фамилия</span>
                <input class="input" type="text" name="last_name" value="{{ employee.last_name }}">
            </label>
            <label class="input-label">
                <span class="input-label__text">Имя</span>
                <input class="input" type="text" name="first_name" value="{{ employee.first_name }}">
            </label>
            <label class="input-label">
                <span class="input-label__text">Отчество</span>
                <input class="input" type="text" name="middle_name" value="{{ employee.middle_name }}">
            </label>
            <label class="input-label">
                <span class="input-label__text">Дата найма</span>
                <input class="input" type="date" name="hire_date" value="{{ employee.hire_date|date:'Y-m-d' }}">
            </label>
            <label class="input-label">
                <span class="input-label__text">Статус</span>
                <select class="input" name="status">
                    <option value="active" {% if employee.status == 'active' %}selected{% endif %}>Активен</option>
                    <option value="fired" {% if employee.status == 'fired' %}selected{% endif %}>Уволен</option>
                    <option value="blocked" {% if employee.status == 'blocked' %}selected{% endif %}>Заблокирован</option>
                </select>
            </label>
        </div>

        <div class="edit-panel">
            <h2 class="edit-panel__title">Карточка сотрудника</h2>
            <label class="input-label">
                <span class="input-label__text">Серия паспорта</span>
                <input class="input" type="text" name="passport_series" value="{{ card.passport_series|default:'' }}">
            </label>
            <label class="input-label">
                <span class="input-label__text">Номер паспорта</span>
                <input class="input" type="text" name="passport_number" value="{{ card.passport_number|default:'' }}">
            </label>
            <label class="input-label">
                <span class="input-label__text">Гражданство</span>
                <input class="input" type="text" name="citizenship" value="{{ card.citizenship|default:'' }}">
            </label>
            <label class="input-label">
                <span class="input-label__text">Адрес прописки</span>
                <input class="input" type="text" name="address" value="{{ card.address|default:'' }}">
            </label>
            <label class="input-label">
                <span class="input-label__text">СНИЛС</span>
                <input class="input" type="text" name="snils" value="{{ card.snils|default:'' }}">
            </label>
            <label class="input-label">
                <span class="input-label__text">ИНН</span>
                <input class="input" type="text" name="inn" value="{{ card.inn|default:'' }}">
            </label>
        </div>

        <div class="edit-panel">
            <h2 class="edit-panel__title">Биометрия</h2>
            <p class="edit-note">🔒 Добавление биометрии будет доступно через API.</p>
        </div>
    </div>

    <div class="form-actions">
        <button class="button button--primary" type="submit">Сохранить</button>
    </div>
</form>

{% endblock %}
