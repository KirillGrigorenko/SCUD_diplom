{# Виджет загрузки фото ладони. Требует: widget_id (уникальный префикс), bioOnCapture(blob) в JS страницы #}
<div id="{{ widget_id }}-wrap">

    <!-- Область превью -->
    <div style="position:relative;border-radius:12px;overflow:hidden;background:#0b0f1a;aspect-ratio:4/3;max-height:260px;margin-bottom:10px;border:1px solid rgba(255,255,255,0.07);display:flex;align-items:center;justify-content:center;">

        <!-- Заглушка (нет файла) -->
        <div id="{{ widget_id }}-idle" style="display:flex;flex-direction:column;align-items:center;gap:10px;color:#475569;">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.2)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <polyline points="17 8 12 3 7 8"/>
                <line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
            <span style="font-size:12px;">Загрузите фото ладони</span>
        </div>

        <!-- Превью выбранного фото -->
        <img id="{{ widget_id }}-preview" style="display:none;position:absolute;inset:0;width:100%;height:100%;object-fit:cover;">
    </div>

    <!-- Кнопка выбора файла -->
    <label style="display:block;cursor:pointer;">
        <input type="file" id="{{ widget_id }}-file" accept="image/*"
            style="display:none;">
        <div id="{{ widget_id }}-btn"
            style="width:100%;padding:8px;border-radius:8px;border:1px dashed rgba(255,255,255,.2);cursor:pointer;font-size:12px;font-weight:500;color:#94a3b8;text-align:center;transition:border-color .2s,color .2s;"
            onmouseover="this.style.borderColor='rgba(14,165,233,.5)';this.style.color='#38bdf8'"
            onmouseout="this.style.borderColor='rgba(255,255,255,.2)';this.style.color='#94a3b8'">
            Выбрать файл
        </div>
    </label>

    <div id="{{ widget_id }}-filename" style="display:none;margin-top:6px;font-size:11px;color:#64748b;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"></div>
</div>

<script>
(function(){
    var fileInput = document.getElementById('{{ widget_id }}-file');
    var idle     = document.getElementById('{{ widget_id }}-idle');
    var preview  = document.getElementById('{{ widget_id }}-preview');
    var filename = document.getElementById('{{ widget_id }}-filename');
    var btn      = document.getElementById('{{ widget_id }}-btn');

    fileInput.addEventListener('change', function(){
        var file = fileInput.files[0];
        if (!file) return;

        var url = URL.createObjectURL(file);
        preview.src = url;
        preview.style.display = 'block';
        idle.style.display = 'none';
        filename.textContent = file.name;
        filename.style.display = 'block';
        btn.textContent = 'Изменить файл';

        // передаём blob в страницу
        if (typeof bioOnCapture === 'function') bioOnCapture(file);
    });
}());
</script>
